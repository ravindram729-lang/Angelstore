<!doctype html><meta charset=utf-8><div id=paymentsTable></div><script>
const escapeHtml=v=>String(v??'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
const r={txn_id:'T1',name:'<img src=x onerror=alert(1)>',utr:'U1',amount:75,method:'UPI',created_at:'2026-09-20',status:'Pending Verification'};
document.querySelector('#paymentsTable').innerHTML=`<tr><td>${escapeHtml(r.txn_id)}</td><td>${escapeHtml(r.name||'—')}<br><small>${escapeHtml(r.utr?'UTR: '+r.utr:'')}</small></td><td>₹ ${Number(r.amount).toFixed(2)}</td><td>${escapeHtml(r.method)}</td><td>${escapeHtml(r.created_at)}</td><td>${escapeHtml(r.status)}</td></tr>`;
window.result={html:document.querySelector('#paymentsTable').innerHTML, imgCount:document.querySelectorAll('#paymentsTable img').length, text:document.querySelector('#paymentsTable').textContent};
</script>
